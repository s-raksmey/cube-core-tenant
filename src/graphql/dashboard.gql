query TenantDashboard {
  tenantDashboard {
    tenant {
      id
      name
      slug
      status
    }
    totalUsers
    activeUsers
    publishedContent
    contentActivityByMonth {
      month
      count
    }
    contentByStatus {
      status
      count
    }
    viewsByMonth { month count }
    sharesByMonth { month count }
  }
}

query TenantAuditLogs($page: Int) {
  tenantAuditLogs(page: $page) {
    items {
      id
      action
      success
      createdAt
      actorEmail
      targetType
      targetId
      details
    }
    total
    page
    pageSize
  }
}

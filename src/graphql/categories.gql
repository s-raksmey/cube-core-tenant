query Categories($search: String, $page: Int, $pageSize: Int) {
  categories(search: $search, page: $page, pageSize: $pageSize) {
    total page pageSize
    items {
      id
      slug
      name
      translations {
        locale
        name
      }
      subcategories {
        id
        categoryId
        slug
        translations {
          locale
          name
        }
      }
    }
  }
}

mutation CreateCategory($input: CreateCategoryInput!) {
  createCategory(input: $input) {
    id
    slug
    name
    translations {
      locale
      name
    }
  }
}

mutation CreateSubcategory($input: CreateSubcategoryInput!) {
  createSubcategory(input: $input) {
    id
    categoryId
    slug
    translations {
      locale
      name
    }
  }
}

mutation UpdateCategory($id: ID!, $input: UpdateCategoryInput!) {
  updateCategory(id: $id, input: $input) {
    id
    slug
    name
    translations {
      locale
      name
    }
  }
}

mutation DeleteCategory($id: ID!) {
  deleteCategory(id: $id)
}

mutation UpdateSubcategory($id: ID!, $input: UpdateSubcategoryInput!) {
  updateSubcategory(id: $id, input: $input) {
    id
    categoryId
    slug
    translations { locale name }
  }
}

mutation DeleteSubcategory($id: ID!) {
  deleteSubcategory(id: $id)
}


query Subcategories($categoryId: ID, $search: String, $page: Int, $pageSize: Int) {
  subcategories(categoryId: $categoryId, search: $search, page: $page, pageSize: $pageSize) {
    total page pageSize
    items { id categoryId slug translations { locale name } }
  }
}

query CategoryOptions($search: String, $page: Int, $pageSize: Int) {
  categories(search: $search, page: $page, pageSize: $pageSize) {
    total page pageSize
    items { id name }
  }
}

query MyGeneralSettings {
  myGeneralSettings {
    siteName
    siteDescription
    contactEmail
    phone
    secondaryPhone
    address
  }
}

mutation UpdateMyGeneralSettings($input: UpdateGeneralSettingsInput!) {
  updateMyGeneralSettings(input: $input) {
    siteName
    siteDescription
    contactEmail
    phone
    secondaryPhone
    address
  }
}

query MyWebsiteSettings {
  myWebsiteSettings {

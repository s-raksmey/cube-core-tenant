    maintenanceMessage
  }
}

mutation UpdateMyWebsiteSettings($input: UpdateWebsiteSettingsInput!) {
  updateMyWebsiteSettings(input: $input) {
    maintenanceMode
    maintenanceMessage
  }
}

query MySocialLinks {
